[project]
name = "hdx-backend"
version = "0.1.0"
description = "Hidden Dependency X-Ray (HDX) Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "networkx>=3.3",
    "motor>=3.4.0",
    "pymongo>=4.7.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "google-genai>=0.1.1",
    "python-multipart>=0.0.9",
    "packaging>=24.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
